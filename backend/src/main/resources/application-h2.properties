# H2 In-Memory Database Profile (for dev/demo without MySQL)
# Usage: java -jar kairos-backend.jar --spring.profiles.active=h2

spring.datasource.url=jdbc:h2:mem:kairos_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (optional: available at /api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.kairos=DEBUG
