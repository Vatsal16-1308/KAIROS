# Production Profile — all secrets MUST come from environment variables
# Usage: java -jar kairos-backend.jar --spring.profiles.active=prod
# Required env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
#                    SPRING_DATASOURCE_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS

# Database — no fallback defaults (will fail fast if not set)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — explicit dialect prevents Hibernate startup crash when URL env var is missing
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT — no fallback secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# CORS — no fallback origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging — quieter in production
logging.level.com.kairos=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR
