# Production Profile — Render PostgreSQL
# Render automatically provides DATABASE_URL when a Postgres DB is linked
# Format: postgresql://USER:PASSWORD@HOST:PORT/DBNAME
# Spring needs it in JDBC form: use SPRING_DATASOURCE_URL in Render env vars:
# jdbc:postgresql://HOST:PORT/DBNAME

# Database — use SPRING_DATASOURCE_URL from Render dashboard (no fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT — no fallback secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging — quieter in production
logging.level.com.kairos=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR
