# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# Spring Application
spring.application.name=kairos-backend

# Database Configuration (MySQL)
# REQUIRED: Set via environment variables for production
# For local dev: set SPRING_DATASOURCE_PASSWORD to your MySQL root password
# Or use --spring.profiles.active=h2 for embedded H2 (no MySQL required)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kairos_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Properties (dialect auto-detected per profile)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
# REQUIRED: Set JWT_SECRET env var in production (min 64 hex chars / 256-bit key)
# The fallback below is for LOCAL DEVELOPMENT ONLY
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
# Set CORS_ALLOWED_ORIGINS to your deployed frontend URL in production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.kairos=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
