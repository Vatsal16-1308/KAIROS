# ================================================
# Render Infrastructure Blueprint — Kairos App
# ================================================
services:
  # ----------------------------------------------
  # Spring Boot Backend (Docker Web Service)
  # ----------------------------------------------
  - type: web
    name: kairos-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: kairos-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: kairos-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: kairos-db
          property: password
      - key: JWT_SECRET
        sync: false # Set a secure 64+ char random hex string in Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        value: https://kairos-frontend.onrender.com,http://localhost:5173

  # ----------------------------------------------
  # React Frontend (Static Site)
  # ----------------------------------------------
  - type: web
    name: kairos-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://kairos-backend.onrender.com/api

# ----------------------------------------------
# Free PostgreSQL Database
# ----------------------------------------------
databases:
  - name: kairos-db
    plan: free
    region: singapore
